<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#000;--tx:#f5f5f5;--c:#0c0c0c;--ln:#1f1f1f;--mu:#8c8c8c;--bd:#2a2a2a;--bd2:#555;--in:#050505;--dim:#666;--ln2:#ddd;--nb:rgba(0,0,0,.94)}
:root[data-theme="gray"]{color-scheme:dark;--bg:#2a2a2c;--tx:#f2f2f2;--c:#343437;--ln:#444447;--mu:#a2a2a7;--bd:#515155;--bd2:#7a7a7e;--in:#232325;--dim:#8a8a8e;--ln2:#e6e6e6;--nb:rgba(42,42,44,.96)}
:root[data-theme="light"]{color-scheme:light;--bg:#fff;--tx:#0a0a0a;--c:#f5f5f5;--ln:#e6e6e6;--mu:#6b6b6b;--bd:#d2d2d2;--bd2:#aaa;--in:#fff;--dim:#9a9a9a;--ln2:#222;--nb:rgba(255,255,255,.94)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
header img{width:34px;height:34px;border-radius:9px}
header b{font-size:20px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nb);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:10px 0 8px;font:600 11px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--tx)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mu);margin:24px 0 10px;font-weight:600}
button{font:inherit;cursor:pointer;color:var(--tx)}
input,select{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:13px;font:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--tx)}
input::placeholder{color:var(--dim)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{text-transform:capitalize}
.nav{background:none;border:1px solid var(--bd);border-radius:12px;width:40px;height:40px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.d{position:relative;aspect-ratio:1;background:none;border:1px solid transparent;border-radius:12px;font-size:15px;padding:0}
.d.today{border-color:var(--bd2)}
.d.sel{background:var(--tx);color:var(--bg);font-weight:700}
.d.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.card{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.card-t{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:4px}
.ln{color:var(--ln2);font-variant-numeric:tabular-nums}
.note{color:var(--mu);font-size:14px;margin-top:8px;padding-left:10px;border-left:2px solid var(--bd)}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid currentColor;border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.x{background:none;border:0;color:var(--dim);font-size:22px;line-height:1;padding:2px 6px}
.mu,.empty{color:var(--mu)}.empty{margin:6px 0 14px}
.sum{color:var(--mu);font-size:14px;margin:-4px 0 12px}
.srow{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:8px;align-items:center;margin-top:8px}
.srow span{color:var(--mu);text-align:center}
.btn{width:100%;border-radius:12px;padding:14px;font-weight:700;margin-top:10px;border:1px solid var(--bd);background:none}
.pri{background:var(--tx);color:var(--bg);border:0}
.hint{color:var(--mu);font-size:14px;margin:8px 2px 0}
.chips{display:flex;gap:8px}
.chips button{flex:1;border:1px solid var(--bd);background:none;border-radius:12px;padding:10px 0;font-weight:600}
.chips button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
#tmr{font-size:36px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:10px}
.hist{padding:12px 0;border-bottom:1px solid var(--ln)}
.hist button{background:none;border:0;padding:0;font-weight:600;text-align:left}
.hist div{font-size:14px;margin-top:2px}
.st{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.st b{display:block;font-size:22px}.st span{color:var(--mu);font-size:12px}
svg.ch{width:100%;height:auto;display:block;margin-top:12px;color:var(--tx)}
.gl{color:var(--mu);font-size:13px;margin-bottom:4px}
.gsel{width:auto;padding:6px 10px;font-size:13px;margin-top:6px;border-radius:10px}
.gh{color:var(--mu);font-size:13px;margin-bottom:10px}
.grow{display:grid;grid-template-columns:96px 1fr 38px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.grow b{text-align:right;font-variant-numeric:tabular-nums}
.grow.z{opacity:.4}
.bar{position:relative;height:8px;background:var(--ln);border-radius:4px}
.bar i{display:block;height:100%;background:var(--tx);border-radius:4px}
.bar u{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--bd2)}
.dayh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 10px}
.dayh h2{margin:0}
.tg{background:none;border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;display:none;z-index:9}
</style>
<script>try{var t=localStorage.getItem("treino:tema");if(t==="light"||t==="gray"){document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#ffffff":"#2a2a2c"}}catch(e){}</script>
</head>
<body>
<main>
<header><img src="icon-192.png" alt=""><b>Treino</b></header>

<section class="tab on" id="t-treino">
  <h2 style="margin-top:4px">Descanso</h2>
  <div class="card">
    <div id="tmr">0:00</div>
    <div class="chips"><button data-s="60">1 min</button><button data-s="90">1:30</button><button data-s="120">2 min</button><button id="stop">Parar</button></div>
  </div>

  <div style="height:22px"></div>
  <div class="cal-h"><button class="nav" id="prev" aria-label="Mês anterior">‹</button><b id="mt"></b><button class="nav" id="next" aria-label="Próximo mês">›</button></div>
  <div class="grid" id="cal"></div>

  <h2>Séries por músculo</h2>
  <div class="chips" id="gm" style="margin-bottom:10px"><button data-m="dia" class="on">Dia</button><button data-m="sem">Semana</button></div>
  <div class="card" id="gbox"></div>

  <h2>Novo exercício</h2>
  <input id="n" list="ex" placeholder="Exercício (ex.: supino máquina)" autocomplete="off">
  <datalist id="ex"></datalist>
  <div class="hint" id="hint"></div>
  <div class="hint" id="gh"></div>
  <select id="gsel" style="margin-top:10px"></select>
  <button class="btn" id="rep" style="display:none">Repetir último treino</button>
  <div id="rows"></div>
  <button class="btn" id="addrow">+ Série</button>
  <input id="nt" placeholder="Observação (ex.: senti o ombro, banco na posição 3)" autocomplete="off" style="margin-top:10px">
  <button class="btn pri" id="save">Salvar exercício</button>

  <div class="dayh"><h2 id="dt"></h2><button class="tg" id="tgl">Ocultar exercícios</button></div>
  <div class="sum" id="sum"></div>
  <div id="day"></div>
</section>

<section class="tab" id="t-hist"><h2 style="margin-top:4px">Histórico</h2><div id="hist"></div></section>

<section class="tab" id="t-ev">
  <h2 style="margin-top:4px">Evolução</h2>
  <select id="evsel"></select>
  <div id="evbox" style="margin-top:12px"></div>
</section>

<section class="tab" id="t-aj">
  <h2 style="margin-top:4px">Aparência</h2>
  <div class="chips"><button id="th-dark">Escuro</button><button id="th-gray">Cinza</button><button id="th-light">Claro</button></div>
  <h2>Backup</h2>
  <p class="mu" style="margin-top:0">Seus treinos ficam salvos neste celular. Faça um backup de vez em quando para não perder nada.</p>
  <button class="btn" id="exp">Exportar backup</button>
  <button class="btn" id="impb">Importar backup</button>
  <input type="file" id="imp" accept="application/json,.json" style="display:none">
  <h2>Dados</h2>
  <button class="btn" id="clr">Apagar todos os treinos</button>
  <p class="mu" style="font-size:13px;margin-top:24px">Treino · versão 6</p>
</section>
</main>

<nav id="nv">
  <button class="on" data-t="treino"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Treino</button>
  <button data-t="hist"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Histórico</button>
  <button data-t="ev"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Evolução</button>
  <button data-t="aj"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div class="toast" id="toast"></div>

<script>
var KEY="treino:v2",items=[];
try{items=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){items=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function pad(n){return String(n).padStart(2,"0")}
function key(y,m,d){return y+"-"+pad(m+1)+"-"+pad(d)}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function short(k){var p=k.split("-");return p[2]+"/"+p[1]}
var now=new Date(),TODAY=key(now.getFullYear(),now.getMonth(),now.getDate());
var showEx=true;try{showEx=localStorage.getItem("treino:ex")!=="0"}catch(e){}
var sel=TODAY,vy=now.getFullYear(),vm=now.getMonth(),draft=[{r:"",w:""}],lastRef=null;
function label(k){var t=parse(k).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"});return(k===TODAY?"Hoje · ":"")+t}
function fmt(s,i){return(i+1)+"x"+s.r+(s.w!==""&&s.w!=null?" "+s.w+"kg":"")}
function same(a,b){return a.trim().toLowerCase()===b.trim().toLowerCase()}
function mx(it){return Math.max.apply(null,it.sets.map(function(s){return+s.w||0}))}
function isPR(it){var p=items.filter(function(o){return o.id!==it.id&&same(o.name,it.name)&&o.ts<it.ts});return p.length>0&&mx(it)>0&&mx(it)>Math.max.apply(null,p.map(mx))}
function lastOf(n){var p=items.filter(function(o){return same(o.name,n)}).sort(function(a,b){return b.ts-a.ts});return p[0]||null}
function suggest(l){var m=mx(l);if(!m)return"";
  if(l.sets.every(function(s){return+s.r>=10})){var n=Math.round(m*1.05*2)/2;if(n<=m)n=m+1;return"Bateu 10+ reps em todas as séries. Sugestão: "+n+"kg"}
  return"Mantenha "+m+"kg e tente mais repetições"}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2500)}

function go(t){
  document.querySelectorAll(".tab").forEach(function(s){s.classList.toggle("on",s.id==="t-"+t)});
  document.querySelectorAll("#nv button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
  window.scrollTo(0,0)}
document.querySelectorAll("#nv button").forEach(function(b){b.onclick=function(){go(b.dataset.t)}});

function renderCal(){
  $("mt").textContent=new Date(vy,vm,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  var g=$("cal");g.innerHTML="";
  ["D","S","T","Q","Q","S","S"].forEach(function(w){g.appendChild(el("div","wd",w))});
  var first=new Date(vy,vm,1).getDay(),days=new Date(vy,vm+1,0).getDate(),has={};
  items.forEach(function(i){has[i.date]=1});
  for(var b=0;b<first;b++)g.appendChild(el("div"));
  for(var d=1;d<=days;d++){(function(d){
    var k=key(vy,vm,d),btn=el("button","d"+(k===sel?" sel":"")+(k===TODAY?" today":"")+(has[k]?" has":""),d);
    btn.onclick=function(){sel=k;render()};g.appendChild(btn)})(d)}
}
function renderDay(){
  $("dt").textContent=label(sel);
  var box=$("day");box.innerHTML="";
  var list=items.filter(function(i){return i.date===sel}).sort(function(a,b){return a.ts-b.ts}),ns=0;
  list.forEach(function(i){ns+=i.sets.length});
  $("sum").textContent=list.length?list.length+(list.length>1?" exercícios":" exercício")+" · "+ns+" séries":"";
  $("tgl").textContent=showEx?"Ocultar exercícios":"Mostrar exercícios";$("tgl").style.display=list.length?"":"none";
  if(!showEx&&list.length)return;
  if(!list.length){box.appendChild(el("p","empty","Nenhum exercício neste dia."));return}
  list.forEach(function(it){
    var c=el("div","card"),t=el("div","card-t"),nm=el("span",null,it.name);
    if(isPR(it))nm.appendChild(el("span","tag","RECORDE"));
    var x=el("button","x","×");x.setAttribute("aria-label","Apagar");
    x.onclick=function(){if(confirm("Apagar "+it.name+"?")){items=items.filter(function(i){return i.id!==it.id});save();render()}};
    t.appendChild(nm);t.appendChild(x);c.appendChild(t);
    var gi=grp(it);
    if(gi.p)c.appendChild(el("div","gl",desc(gi)));
    else{var sl=document.createElement("select");sl.className="gsel";sl.innerHTML='<option value="">Definir músculo…</option>'+GR.map(function(g){return"<option>"+g+"</option>"}).join("");sl.onchange=function(){it.g=this.value;save();render()};c.appendChild(sl)}
    it.sets.forEach(function(s,i){c.appendChild(el("div","ln",fmt(s,i)))});
    if(it.note)c.appendChild(el("div","note",it.note));
    box.appendChild(c)})
}
function renderRows(){
  var box=$("rows");box.innerHTML="";
  draft.forEach(function(s,i){
    var row=el("div","srow");row.appendChild(el("span",null,(i+1)+"x"));
    var r=el("input");r.type="number";r.inputMode="numeric";r.placeholder="Reps";r.value=s.r;r.oninput=function(){s.r=r.value};
    var w=el("input");w.type="number";w.inputMode="decimal";w.step="any";w.placeholder="kg";w.value=s.w;w.oninput=function(){s.w=w.value};
    row.appendChild(r);row.appendChild(w);
    if(draft.length>1){var x=el("button","x","×");x.onclick=function(){draft.splice(i,1);renderRows()};row.appendChild(x)}else row.appendChild(el("span"));
    box.appendChild(row)})
}
function hint(){
  var n=$("n").value.trim(),h=$("hint"),b=$("rep");h.textContent="";b.style.display="none";lastRef=null;
  if(!n)return;var l=lastOf(n);if(!l)return;lastRef=l;
  var sg=suggest(l);h.textContent="Última vez ("+short(l.date)+"): "+l.sets.map(fmt).join(" · ")+(sg?". "+sg:"")+(l.note?". Obs.: "+l.note:"");b.style.display="block"}
function renderHist(){
  var box=$("hist");box.innerHTML="";var days={};
  items.forEach(function(i){(days[i.date]=days[i.date]||[]).push(i)});
  var ks=Object.keys(days).sort().reverse();
  if(!ks.length){box.appendChild(el("p","empty","Seus treinos aparecem aqui."));return}
  ks.forEach(function(k){
    var h=el("div","hist"),b=el("button",null,label(k));
    b.onclick=function(){sel=k;var d=parse(k);vy=d.getFullYear();vm=d.getMonth();render();go("treino")};
    h.appendChild(b);
    days[k].sort(function(a,b){return a.ts-b.ts}).forEach(function(it){h.appendChild(el("div","mu",it.name+": "+it.sets.map(fmt).join(" · ")+(it.note?" — "+it.note:"")))});
    box.appendChild(h)})
}
function renderNames(){
  var dl=$("ex");dl.innerHTML="";var seen={};
  items.forEach(function(i){var k=i.name.trim().toLowerCase();if(!seen[k]){seen[k]=1;var o=document.createElement("option");o.value=i.name;dl.appendChild(o)}})
}
function renderEv(){
  var names={};items.forEach(function(i){names[i.name.trim().toLowerCase()]=i.name.trim()});
  var ks=Object.keys(names).sort(),s=$("evsel"),cur=s.value,box=$("evbox");
  s.innerHTML="";box.innerHTML="";
  if(!ks.length){s.style.display="none";box.appendChild(el("p","empty","Anote exercícios para ver sua evolução."));return}
  s.style.display="block";
  ks.forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=names[k];s.appendChild(o)});
  if(cur&&names[cur])s.value=cur;
  var ses=items.filter(function(i){return same(i.name,s.value)}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts});
  var pts=ses.map(mx),best=Math.max.apply(null,pts),card=el("div","card"),st=el("div","st");
  [[ses.length,"sessões"],[best?best+"kg":"—","melhor carga"],[pts[pts.length-1]?pts[pts.length-1]+"kg":"—","última carga"]].forEach(function(a){
    var d=el("div");d.appendChild(el("b",null,a[0]));d.appendChild(el("span",null,a[1]));st.appendChild(d)});
  card.appendChild(st);
  if(pts.length>1&&best>0){
    var W=300,H=90,p=10,lo=Math.min.apply(null,pts),rg=(best-lo)||1,xy=pts.map(function(v,i){return[p+i*(W-2*p)/(pts.length-1),H-p-(v-lo)/rg*(H-2*p)]});
    var sv='<svg class="ch" viewBox="0 0 '+W+' '+H+'"><polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" points="'+xy.map(function(q){return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ")+'"/>'+xy.map(function(q){return'<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3.5" fill="currentColor"/>'}).join("")+'</svg>';
    var w=el("div");w.innerHTML=sv;card.appendChild(w)}
  box.appendChild(card);
  ses.slice().reverse().forEach(function(it){box.appendChild(el("div","hist",short(it.date)+" · "+it.sets.map(fmt).join(" · ")+(it.note?" — "+it.note:"")))})
}
var SEC=0.5,gmode="dia",GR=["Peito","Costas","Ombros","Bíceps","Tríceps","Quadríceps","Posterior","Glúteos","Panturrilha","Abdômen"];
var MAP=[
 ["crucifixo inverso|voador inverso|face pull|elevacao posterior|ombro posterior|remada alta","Ombros",[]],
 ["crucifixo|voador|peck|crossover|cross over|fly","Peito",[]],
 ["supino|flexao|chest press|peitoral|peito","Peito",["Tríceps","Ombros"]],
 ["elevacao lateral|elevacao frontal|lateral raise","Ombros",[]],
 ["desenvolvimento|militar|shoulder press|arnold","Ombros",["Tríceps"]],
 ["triceps|frances|testa|mergulho","Tríceps",[]],
 ["flexora|leg curl","Posterior",[]],
 ["stiff|romeno|terra","Posterior",["Glúteos"]],
 ["rosca|biceps|curl|martelo","Bíceps",[]],
 ["encolhimento|shrug|trapezio","Costas",[]],
 ["remada|puxada|puxador|barra fixa|pull|serrote","Costas",["Bíceps"]],
 ["agachamento|leg press|hack|afundo|passada|avanco|bulgaro|squat","Quadríceps",["Glúteos"]],
 ["extensora","Quadríceps",[]],
 ["elevacao pelvica|hip thrust|gluteo|abdutora|coice","Glúteos",[]],
 ["panturrilha|gemeos|calf","Panturrilha",[]],
 ["abdominal|prancha|crunch|abdomen|infra","Abdômen",[]]
];
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function detect(n){var t=norm(n);for(var i=0;i<MAP.length;i++){var k=MAP[i][0].split("|");for(var j=0;j<k.length;j++)if(t.indexOf(k[j])>=0)return{p:MAP[i][1],s:MAP[i][2]}}return null}
function grp(it){var d=detect(it.name);
  if(it.g)return{p:it.g,s:(d&&d.p===it.g)?d.s:[]};
  return d||{p:"",s:[]}}
function fm(v){return String(Math.round(v*10)/10).replace(".",",")}
function desc(g,num){return[g.p+(num?" 1":"")].concat(g.s.map(function(x){return x+(num?" "+fm(SEC):" ½")})).join(" · ")}
function counts(list){var c={};GR.forEach(function(g){c[g]=0});
  list.forEach(function(it){var g=grp(it),n=it.sets.length;if(g.p)c[g.p]+=n;g.s.forEach(function(x){c[x]+=n*SEC})});return c}
function weekRange(k){var d=parse(k),w=(d.getDay()+6)%7,a=new Date(d.getFullYear(),d.getMonth(),d.getDate()-w),b=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);
  return[key(a.getFullYear(),a.getMonth(),a.getDate()),key(b.getFullYear(),b.getMonth(),b.getDate())]}
function renderG(){
  var box=$("gbox");box.innerHTML="";var sem=gmode==="sem",r=weekRange(sel);
  var list=items.filter(function(i){return sem?(i.date>=r[0]&&i.date<=r[1]):i.date===sel}),c=counts(list);
  var un=list.filter(function(i){return!grp(i).p}).map(function(i){return i.name});
  box.appendChild(el("div","gh",sem?"Semana de "+short(r[0])+" a "+short(r[1])+". Referência: 10 a 20 séries por músculo.":"Séries do dia "+short(sel)+"."));
  var mxv=sem?20:Math.max(6,Math.max.apply(null,GR.map(function(g){return c[g]})));
  GR.map(function(g,i){return{g:g,v:c[g],i:i}}).sort(function(a,b){return b.v-a.v||a.i-b.i}).forEach(function(o){
    var row=el("div","grow"+(o.v?"":" z"));row.appendChild(el("span",null,o.g));
    var bar=el("div","bar"),f=document.createElement("i");f.style.width=Math.min(100,o.v/mxv*100)+"%";bar.appendChild(f);
    if(sem)bar.appendChild(document.createElement("u"));
    row.appendChild(bar);row.appendChild(el("b",null,fm(o.v)));box.appendChild(row)});
  if(un.length)box.appendChild(el("div","note","Sem músculo definido: "+un.join(", ")))}
function updG(){var n=$("n").value.trim(),h=$("gh");
  if(!n){h.textContent="";return}
  var g=grp({name:n,g:$("gsel").value});
  h.textContent=g.p?"Cada série conta como: "+desc(g,true):"Não reconheci o exercício. Escolha o músculo abaixo."}
function render(){renderCal();renderDay();renderG();renderHist();renderNames();renderEv()}

var tm=null,endAt=0;
function tick(){
  var left=Math.ceil((endAt-Date.now())/1000);
  if(left>0){$("tmr").textContent=Math.floor(left/60)+":"+pad(left%60);return}
  clearInterval(tm);tm=null;endAt=0;try{localStorage.removeItem("treino:endAt")}catch(e){}
  $("tmr").textContent="Pronto!";try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function rest(sec){clearInterval(tm);endAt=Date.now()+sec*1000;try{localStorage.setItem("treino:endAt",endAt)}catch(e){}tick();tm=setInterval(tick,250)}
document.addEventListener("visibilitychange",function(){if(endAt)tick()});
document.querySelectorAll(".chips button[data-s]").forEach(function(b){b.onclick=function(){rest(+b.dataset.s)}});
$("stop").onclick=function(){clearInterval(tm);tm=null;endAt=0;try{localStorage.removeItem("treino:endAt")}catch(e){}$("tmr").textContent="0:00"};
try{var ra=+localStorage.getItem("treino:endAt");if(ra>Date.now()){endAt=ra;tick();tm=setInterval(tick,250)}}catch(e){}

$("prev").onclick=function(){vm--;if(vm<0){vm=11;vy--}renderCal()};
$("next").onclick=function(){vm++;if(vm>11){vm=0;vy++}renderCal()};
$("n").oninput=function(){hint();updG()};
$("gsel").onchange=updG;
$("rep").onclick=function(){if(lastRef){draft=lastRef.sets.map(function(s){return{r:s.r,w:s.w}});renderRows()}};
$("evsel").onchange=renderEv;
$("tgl").onclick=function(){showEx=!showEx;try{localStorage.setItem("treino:ex",showEx?"1":"0")}catch(e){}renderDay()};
$("addrow").onclick=function(){var l=draft[draft.length-1];draft.push({r:l.r,w:l.w});renderRows()};
$("save").onclick=function(){
  var n=$("n"),name=n.value.trim();
  var sets=draft.filter(function(s){return s.r!==""}).map(function(s){return{r:+s.r,w:s.w===""?"":+s.w}});
  if(!name||!sets.length){toast("Informe o exercício e as repetições");n.focus();return}
  var ni={id:Date.now()+Math.random(),ts:Date.now(),date:sel,name:name,sets:sets,note:$("nt").value.trim()};if($("gsel").value)ni.g=$("gsel").value;items.push(ni);
  save();var pr=isPR(items[items.length-1]);n.value="";$("nt").value="";$("gsel").value="";draft=[{r:"",w:""}];renderRows();hint();updG();render();
  toast(pr?"Novo recorde de carga!":(grp(ni).p?"Exercício salvo":"Salvo. Defina o músculo no exercício para contar as séries"))};

$("exp").onclick=function(){
  var b=new Blob([JSON.stringify(items)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="treino-backup-"+TODAY+".json";document.body.appendChild(a);a.click();a.remove();toast("Backup exportado")};
$("impb").onclick=function(){$("imp").click()};
$("imp").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;
    var ids={},n=0;items.forEach(function(i){ids[i.id]=1});
    a.forEach(function(i){if(i&&i.name&&i.date&&Array.isArray(i.sets)&&!ids[i.id]){if(i.id==null)i.id=Date.now()+Math.random();if(!i.ts)i.ts=Date.now();items.push(i);n++}});
    save();render();toast(n+" exercício(s) importado(s)")}catch(e){toast("Arquivo inválido")}};
  r.readAsText(f);this.value=""};
$("clr").onclick=function(){if(confirm("Apagar todos os treinos? Isso não pode ser desfeito.")){items=[];save();render();toast("Tudo apagado")}};

function setTheme(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("treino:tema",t)}catch(e){}
  var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="light"?"#ffffff":t==="gray"?"#2a2a2c":"#000000";
  ["dark","gray","light"].forEach(function(k){$("th-"+k).classList.toggle("on",k===t)})}
["dark","gray","light"].forEach(function(k){$("th-"+k).onclick=function(){setTheme(k)}});
var th="dark";try{var sv=localStorage.getItem("treino:tema");if(sv==="light"||sv==="gray")th=sv}catch(e){}
setTheme(th);

$("gsel").innerHTML='<option value="">Músculo: automático</option>'+GR.map(function(g){return"<option>"+g+"</option>"}).join("");
document.querySelectorAll("#gm button").forEach(function(b){b.onclick=function(){gmode=b.dataset.m;document.querySelectorAll("#gm button").forEach(function(x){x.classList.toggle("on",x===b)});renderG()}});
renderRows();render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
